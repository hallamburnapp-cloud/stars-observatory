# Releasing, in two clicks:
#   1. Actions → "Release" → Run workflow → version (e.g. 1.7.0).
#      Refuses unless CITATION.cff on main carries that version, then creates a
#      DRAFT release v<version> with notes from .github/release-notes/v<version>.md.
#   2. Open the draft on the Releases page and press "Publish release".
#      A person must publish: Zenodo does not archive releases published by the
#      Actions token (it ignored v1.7.0 when the workflow published it itself).
# Publishing triggers the second job: wait for Zenodo to archive the release and
# mint its version DOI, then redeploy so the OSCOLA citation carries it. Until
# then build_citation.py cites the concept DOI, never a mismatched one.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (must equal CITATION.cff)"
        required: true
  release:
    types: [published]

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check version matches CITATION.cff
        run: |
          CFF=$(sed -nE 's/^version:\s*"?([0-9]+\.[0-9]+\.[0-9]+)"?\s*$/\1/p' CITATION.cff)
          echo "CITATION.cff version: $CFF"
          [ "$CFF" = "$V" ] || { echo "::error::CITATION.cff says $CFF, not $V — bump it on main first"; exit 1; }
          if gh release view "v$V" >/dev/null 2>&1; then echo "::error::release v$V already exists"; exit 1; fi

      - name: Create draft release
        run: |
          NOTES=".github/release-notes/v$V.md"
          if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
          TITLE=$(head -1 "$NOTES" 2>/dev/null | sed -E 's/^#+\s*//')
          gh release create "v$V" --draft --target main --title "${TITLE:-v$V}" "${ARGS[@]}"
          echo "::notice::Draft v$V created. Publish it from the Releases page to archive it on Zenodo."

  archive-and-redeploy:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ github.event.release.tag_name }}
      CONCEPT_RECID: "22662848"
    steps:
      - name: Wait for Zenodo to archive ${{ github.event.release.tag_name }}
        run: |
          V="${V#v}"
          for i in $(seq 1 60); do
            GOT=$(curl -fsS "https://zenodo.org/api/records/$CONCEPT_RECID" | python3 -c "import json,sys; r=json.load(sys.stdin); print(r['metadata'].get('version',''), r['doi'])" || true)
            echo "Zenodo latest: $GOT"
            case "$GOT" in "v$V "*|"$V "*) echo "archived"; exit 0;; esac
            sleep 30
          done
          echo "::warning::Zenodo has not archived v$V after 30 minutes. The site keeps citing the concept DOI; the next daily refresh will pick up the version DOI automatically."

      - name: Redeploy so the citation carries the new version DOI
        run: gh workflow run refresh.yml --ref main
