# Weekly check that every national space-law source link still loads.
# The legal content itself is curated by hand; this only flags dead links by
# opening (or commenting on) one tracking issue.
name: Space-law source links

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links
        id: check
        run: |
          set +e
          python pipeline/check_law_links.py > report.md
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat report.md
      - name: Open or update tracking issue
        if: steps.check.outputs.rc != '0'
        run: |
          TITLE="Space-law source links need attention"
          N=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --repo "$REPO" --body-file report.md
          else gh issue create --repo "$REPO" --title "$TITLE" --body-file report.md; fi
