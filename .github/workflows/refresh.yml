name: Daily data refresh & deploy

# A fetch run downloads the day's catalogue; every other run re-stages the
# snapshot the site already publishes. Fetch runs are started once a day by the
# hourly scheduler (refresh-scheduler.yml), which waits for each one and fails
# if it fails. Their run name marks them, which is how the scheduler recognises
# a fetch run that is under way or has failed. Test runs have their own names,
# so the scheduler never counts them as the day's fetch.
run-name: >-
  ${{ inputs.test_failure && 'Alert test (deliberate failure)'
  || inputs.fetch && !inputs.deploy && 'Test fetch (nothing published)'
  || inputs.fetch && 'Daily data refresh (fetch)'
  || '' }}

on:
  workflow_dispatch:
    inputs:
      fetch:
        description: "Download today's catalogue. The hourly scheduler does this once a day; tick it only if today's data has not been fetched."
        type: boolean
        default: false
      deploy:
        description: "Publish the result. Untick for a test run: it downloads and checks everything, but commits no ledger, deploys nothing and touches no issue."
        type: boolean
        default: true
      test_failure:
        description: "Alert test: fail on purpose at the first step, before anything is downloaded, committed or deployed (the scheduler's alert test sets this)."
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-deploy
  cancel-in-progress: false

jobs:
  refresh:
    # The runner image and the Playwright version are pinned, and change only
    # together, in a change whose QA runs pass. ubuntu-latest is not used: when
    # GitHub moved it to Ubuntu 26.04 (from 19 October 2026), the Playwright then
    # pinned (1.59.0) could not install its browser there ("Playwright does not
    # support chromium on ubuntu26.04-x64"), which failed every refresh from 29
    # October to 1 November 2026. Ubuntu 26.04 needs Playwright 1.61.0 or later.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      generated: ${{ steps.snapshot.outputs.generated }}
      stats_generated: ${{ steps.snapshot.outputs.stats_generated }}
    steps:
      - name: Alert test - fail on purpose before anything is downloaded, committed or deployed
        if: inputs.test_failure
        run: |
          echo "::error::Deliberate failure (alert test): nothing was downloaded, committed or deployed."
          exit 1

      # Fetch runs that publish build on the latest main, not on the commit that
      # queued them, so a re-run of a failed fetch run starts from the ledger
      # commit that run may already have pushed, instead of conflicting with it
      # (the re-run of 12 October 2026 failed that way). Other runs, test fetch
      # runs included, use the commit that triggered them.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.fetch && inputs.deploy && 'main' || '' }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Unit tests (snapshot validation, failure alerts)
        run: python -m unittest discover -s tests -p "test_*.py"

      # CelesTrak and GCAT are contacted only by fetch runs: once a day, plus a
      # retry by the scheduler if a download fails. Any failed download, and any
      # snapshot with an empty count or a count more than 10% from the one the
      # site serves now, halts the run and nothing is deployed, so the site keeps
      # its previous snapshot and date (and the alert job below reports it).
      # Pushes and other runs never download: they re-stage the snapshot the site
      # already publishes.
      - name: Fetch the day's data (fetch run) or re-stage the published snapshot
        run: python pipeline/refresh.py --mode ${{ inputs.fetch && 'fetch' || 'rebuild' }}

      - name: Read the snapshot timestamp
        id: snapshot
        run: |
          echo "generated=$(python3 -c "import json;print(json.load(open('site/data/sats.json'))['generated'])")" >> "$GITHUB_OUTPUT"
          echo "stats_generated=$(python3 -c "import json;print(json.load(open('site/data/stats.json'))['generated'])")" >> "$GITHUB_OUTPUT"

      - name: Commit registration lag ledger
        if: inputs.fetch && inputs.deploy
        env:
          GENERATED: ${{ steps.snapshot.outputs.generated }}
        run: |
          git config user.name "stars-observatory-bot"
          git config user.email "actions@github.com"
          # ledger = daily longitudinal record; zenodo_cache = DOI fallback (changes on releases).
          # Generated site/data/*.json stay uncommitted by design — the Pages artifact carries them.
          git add data/ledger.json data/zenodo_cache.json
          # Dated by the snapshot, not the clock: the scheduler reads this commit
          # as "today's data has been fetched".
          git diff --cached --quiet || git commit -m "Ledger update: ${GENERATED:0:10}"
          # autostash: the freshly generated site/data/*.json stay uncommitted by design
          git pull --rebase --autostash origin main
          git push

      # ---- QA gate: a failure here blocks the Pages deploy ----
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-ubuntu-26.04-1.64.1

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: QA gate (citation integrity, full pickability sweep, controls)
        run: node tests/run_qa.mjs

      # Daily dataset snapshots are archived by the companion repository
      # stars-observatory-data: its workflow checks the deployed data every hour
      # and archives each new snapshot the first time it sees it. Kept out of this
      # repo so the rolling data-archive release never touches the Zenodo webhook
      # that mints software DOIs here.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: refresh
    # A test run (deploy unticked) publishes nothing.
    if: github.event_name != 'workflow_dispatch' || (inputs.deploy && !inputs.test_failure)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # A failed fetch run leaves the live site serving the previous snapshot. Open
  # one issue (or comment on it while it is open) that @-mentions the maintainer,
  # with the failed step, its error line and a link to the run. If the issue
  # cannot be written, this job fails too. Test fetch runs (deploy unticked) do
  # not report here; the alert test reports in its own issue.
  alert-on-failure:
    needs: [refresh, deploy]
    if: failure() && (inputs.test_failure || (inputs.fetch && inputs.deploy))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Open or update the refresh-failure issue, mentioning the maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          TEST: ${{ inputs.test_failure }}
        run: python3 .github/scripts/refresh_alert.py alert "${{ github.run_id }}"

  # A successful fetch run ends the problem the issue reports: once the site
  # serves the new snapshot, close the issue with a note naming it.
  close-stale-issue:
    needs: [refresh, deploy]
    if: success() && inputs.fetch && inputs.deploy && !inputs.test_failure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Close the refresh-failure issue once the new snapshot is live
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 .github/scripts/refresh_alert.py resolve
          "${{ needs.refresh.outputs.stats_generated }}" "${{ needs.refresh.outputs.generated }}"
