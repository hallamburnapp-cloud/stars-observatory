name: Daily data refresh & deploy

on:
  schedule:
    # 06:17 UTC daily, off the top of the hour, when GitHub's scheduler is busiest.
    # GitHub can still start a scheduled run late, sometimes by several hours, so
    # the site states the time each snapshot was actually fetched, not this time.
    - cron: "17 6 * * *"
  workflow_dispatch: {} # manual trigger button
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Scheduled runs build on the latest main, not on the commit that queued
      # them. A re-run of a failed scheduled run then starts from the ledger
      # commit that run may already have pushed, instead of conflicting with it
      # (the re-run of 12 October 2026 failed that way). Push and manual runs
      # keep the default: the commit that triggered them.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || '' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CelesTrak and GCAT are contacted only by the daily schedule, once per
      # day. Any failed download halts the run and nothing is deployed, so the
      # site keeps its previous snapshot and date (and the alert job below
      # opens an issue). Pushes and manual runs never download: they re-stage
      # the snapshot the site already publishes, unchanged.
      - name: Refresh dataset (schedule) or re-stage the published snapshot (push / manual)
        run: python pipeline/refresh.py --mode ${{ github.event_name == 'schedule' && 'fetch' || 'rebuild' }}

      - name: Commit registration lag ledger
        if: github.event_name == 'schedule'
        run: |
          git config user.name "stars-observatory-bot"
          git config user.email "actions@github.com"
          # ledger = daily longitudinal record; zenodo_cache = DOI fallback (changes on releases).
          # Generated site/data/*.json stay uncommitted by design — the Pages artifact carries them.
          git add data/ledger.json data/zenodo_cache.json
          git diff --cached --quiet || git commit -m "Ledger update: $(date -u +%F)"
          # autostash: the freshly generated site/data/*.json stay uncommitted by design
          git pull --rebase --autostash origin main
          git push

      # ---- QA gate: a failure here blocks the Pages deploy ----
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.59.0

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.59.0
          npx playwright install --with-deps chromium

      - name: QA gate (citation integrity, full pickability sweep, controls)
        run: node tests/run_qa.mjs

      # Daily dataset snapshots are archived by the companion repository
      # stars-observatory-data: its workflow checks the deployed data every hour
      # and archives each new snapshot the first time it sees it. Kept out of this
      # repo so the rolling data-archive release never touches the Zenodo webhook
      # that mints software DOIs here.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # A failed scheduled refresh leaves the live site serving the previous
  # snapshot. Make that visible: open (or update) one tracking issue.
  alert-on-failure:
    needs: [refresh, deploy]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the stale-data issue
        run: |
          TITLE="Daily refresh failed - live site is serving an old data snapshot"
          BODY="The scheduled refresh on $(date -u +%F) failed, so starsobservatory.org still shows the last successful snapshot. Run: $RUN_URL"
          N=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --repo "$REPO" --body "$BODY"
          else gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"; fi

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
