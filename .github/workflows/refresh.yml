name: Daily data refresh & deploy

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {} # manual trigger button
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Source files persist between runs. CelesTrak refuses repeat downloads
      # from the same (shared) runner IP within ~2 h; refresh.py then keeps the
      # previous file, which only exists if we carried it over. The staleness
      # guard in refresh.py still fails the run if what we keep is > 3 days old.
      - name: Restore previous source files
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Refresh dataset
        run: python pipeline/refresh.py

      - name: Save source files for the next run
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}

      - name: Commit registration lag ledger
        run: |
          git config user.name "stars-observatory-bot"
          git config user.email "actions@github.com"
          # ledger = daily longitudinal record; zenodo_cache = DOI fallback (changes on releases).
          # Generated site/data/*.json stay uncommitted by design — the Pages artifact carries them.
          git add data/ledger.json data/zenodo_cache.json
          git diff --cached --quiet || git commit -m "Ledger update: $(date -u +%F)"
          # autostash: the freshly generated site/data/*.json stay uncommitted by design
          git pull --rebase --autostash origin main
          git push

      # ---- QA gate: a failure here blocks the Pages deploy ----
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.59.0

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.59.0
          npx playwright install --with-deps chromium

      - name: QA gate (citation integrity, full pickability sweep, controls)
        run: node tests/run_qa.mjs

      # Daily dataset snapshots are archived by the companion repository
      # stars-observatory-data (its own scheduled workflow pulls the deployed
      # data at 06:30 UTC). Kept out of this repo so the rolling data-archive
      # release never touches the Zenodo webhook that mints software DOIs here.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # A failed scheduled refresh leaves the live site serving the previous
  # snapshot. Make that visible: open (or update) one tracking issue.
  alert-on-failure:
    needs: [refresh, deploy]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the stale-data issue
        run: |
          TITLE="Daily refresh failed - live site is serving an old data snapshot"
          BODY="The scheduled refresh on $(date -u +%F) failed, so starsobservatory.org still shows the last successful snapshot. Run: $RUN_URL"
          N=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --repo "$REPO" --body "$BODY"
          else gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"; fi

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
