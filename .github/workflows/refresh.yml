name: Daily data refresh & deploy

# A fetch run downloads the day's catalogue; every other run re-stages the
# snapshot the site already publishes. Fetch runs are started once a day by the
# hourly scheduler (refresh-scheduler.yml). Their run name marks them, which is
# how the scheduler recognises a fetch run that is under way or has failed.
run-name: ${{ inputs.fetch && 'Daily data refresh (fetch)' || '' }}

on:
  workflow_dispatch:
    inputs:
      fetch:
        description: "Download today's catalogue. The hourly scheduler does this once a day; tick it only if today's data has not been fetched."
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      generated: ${{ steps.snapshot.outputs.generated }}
    steps:
      # Fetch runs build on the latest main, not on the commit that queued them,
      # so a re-run of a failed fetch run starts from the ledger commit that run
      # may already have pushed, instead of conflicting with it (the re-run of
      # 12 October 2026 failed that way). Other runs use the commit that
      # triggered them.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.fetch && 'main' || '' }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # CelesTrak and GCAT are contacted only by fetch runs: once a day, plus a
      # retry by the scheduler if a download fails. Any failed download halts the
      # run and nothing is deployed, so the site keeps its previous snapshot and
      # date (and the alert job below opens an issue). Pushes and other runs
      # never download: they re-stage the snapshot the site already publishes.
      - name: Fetch the day's data (fetch run) or re-stage the published snapshot
        run: python pipeline/refresh.py --mode ${{ inputs.fetch && 'fetch' || 'rebuild' }}

      - name: Read the snapshot timestamp
        id: snapshot
        run: echo "generated=$(python3 -c "import json;print(json.load(open('site/data/sats.json'))['generated'])")" >> "$GITHUB_OUTPUT"

      - name: Commit registration lag ledger
        if: inputs.fetch
        env:
          GENERATED: ${{ steps.snapshot.outputs.generated }}
        run: |
          git config user.name "stars-observatory-bot"
          git config user.email "actions@github.com"
          # ledger = daily longitudinal record; zenodo_cache = DOI fallback (changes on releases).
          # Generated site/data/*.json stay uncommitted by design — the Pages artifact carries them.
          git add data/ledger.json data/zenodo_cache.json
          # Dated by the snapshot, not the clock: the scheduler reads this commit
          # as "today's data has been fetched".
          git diff --cached --quiet || git commit -m "Ledger update: ${GENERATED:0:10}"
          # autostash: the freshly generated site/data/*.json stay uncommitted by design
          git pull --rebase --autostash origin main
          git push

      # ---- QA gate: a failure here blocks the Pages deploy ----
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.59.0

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.59.0
          npx playwright install --with-deps chromium

      - name: QA gate (citation integrity, full pickability sweep, controls)
        run: node tests/run_qa.mjs

      # Daily dataset snapshots are archived by the companion repository
      # stars-observatory-data: its workflow checks the deployed data every hour
      # and archives each new snapshot the first time it sees it. Kept out of this
      # repo so the rolling data-archive release never touches the Zenodo webhook
      # that mints software DOIs here.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # A failed fetch run leaves the live site serving the previous snapshot.
  # Make that visible: open (or update) one tracking issue.
  alert-on-failure:
    needs: [refresh, deploy]
    if: failure() && inputs.fetch
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the stale-data issue
        run: |
          TITLE="Daily refresh failed - live site is serving an old data snapshot"
          BODY="The daily refresh on $(date -u +%F) failed, so starsobservatory.org still shows the last successful snapshot. If the download failed, the hourly scheduler tries again, up to six fetch runs a day; if a later step failed, re-run the failed jobs once the cause is fixed. Run: $RUN_URL"
          N=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --repo "$REPO" --body "$BODY"
          else gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"; fi

  # A successful fetch run ends the problem the stale-data issue reports:
  # close it, naming the snapshot that is now live.
  close-stale-issue:
    needs: [refresh, deploy]
    if: success() && inputs.fetch
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      GENERATED: ${{ needs.refresh.outputs.generated }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Close the stale-data issue if one is open
        run: |
          TITLE="Daily refresh failed - live site is serving an old data snapshot"
          N=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -z "$N" ]; then echo "No open stale-data issue."; exit 0; fi
          gh issue close "$N" --repo "$REPO" --reason completed --comment "Resolved: the daily refresh succeeded, and starsobservatory.org now serves the snapshot of ${GENERATED:0:10}, fetched at ${GENERATED:11:5} UTC. Run: $RUN_URL"
